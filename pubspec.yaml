name: agrismart_auth
description: Login & Register AgriSmart (enkripsi, session, biometrik, SQLite + API online)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1            # database lokal SQLite
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.3               # SHA-256 / HMAC untuk PBKDF2
  flutter_secure_storage: ^9.2.2  # simpan session token terenkripsi (Keystore/Keychain)
  local_auth: ^2.3.0           # sidik jari / face unlock
  http: ^1.6.0                 # koneksi database online (REST API)
  google_fonts: ^6.2.1
  geolocator: ^14.0.2
  image_picker: ^1.2.4
  sensors_plus: ^6.0.0
  html: ^0.15.7
  supabase_flutter: ^2.18.3
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  web3dart: 2.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/icon/icon.jpeg"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/icon/plantguard_icon.png"  

flutter_native_splash:
  color: "#F3F7F1"
  image: assets/icon/icon.png
  android: true
  ios: false
  android_12:
    color: "#F3F7F1"
    image: lib/assets/icon/icon.png
